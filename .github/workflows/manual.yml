name: Send Issue to CVE Backend

on:
  issues:
    types: [opened]

jobs:
  send-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Extract CVE ID from issue
        id: extract
        run: |
          # Extract CVE ID from issue title
          CVE_ID=$(echo "${{ github.event.issue.title }}" | grep -oE 'CVE-[0-9]{4}-[0-9]+' || true)

          if [ -z "$CVE_ID" ]; then
            echo "CVE ID not found in issue title"
            exit 1
          fi

          echo "cve_id=$CVE_ID" >> $GITHUB_OUTPUT
          echo "Extracted CVE ID: $CVE_ID"

      - name: Send issue to backend
        run: |
          # Send POST request to backend and capture body + HTTP status
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST http://20.3.140.91/api/cves \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
            -d '{
              "orgId": "${{ vars.ORG_ID }}",
              "cveId": "${{ steps.extract.outputs.cve_id }}",
              "issue": ${{ github.event.issue.number }}
            }')

          # Split response body and status code
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)

          echo "HTTP Status: $STATUS"
          echo "Response Body:"
          echo "$BODY"

          # Fail workflow on non-2xx responses
          if ! [[ "$STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "Backend returned an error ($STATUS)"
            exit 1
          fi

          echo "Successfully sent issue to backend"
