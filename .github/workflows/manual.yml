name: Send Issue to CVE Backend

on:
  issues:
    types: [opened]

jobs:
  send-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Extract CVE ID from issue
        id: extract
        run: |
          CVE_ID=$(echo "${{ github.event.issue.title }}" | grep -oE 'CVE-[0-9]{4}-[0-9]+' || true)

          if [ -z "$CVE_ID" ]; then
            echo "CVE ID not found in issue title"
            exit 1
          fi

          echo "cve_id=$CVE_ID" >> $GITHUB_OUTPUT

      - name: Send issue to backend
        run: |
          curl -s -o response.txt -w "%{http_code}" \
            -X POST http://20.3.140.91/api/cves \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
            -d '{
              "orgId": "${{ vars.ORG_ID }}",
              "cveId": "${{ steps.extract.outputs.cve_id }}",
              "issue": "${{ github.event.issue.number }}"
            }'

      - name: Validate backend response
        run: |
          STATUS=$(tail -n 1 response.txt)
          BODY=$(head -n -1 response.txt)

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Backend error ($STATUS)"
            echo "$BODY"
            exit 1
          fi

          echo "Successfully sent issue to backend"
